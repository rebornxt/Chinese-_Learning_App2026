<!DOCTYPE html>
<html lang="zh-TH">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เรียนภาษาจีน - Chinese Learning App</title>
    <style>
        :root {
            --bg: #f5f0eb;
            --card-bg: #ffffff;
            --text: #2c2416;
            --text-secondary: #6b5e4a;
            --accent: #c41e3a;
            --accent-light: #fde8ec;
            --gold: #b8860b;h
            --gold-light: #fff8e7;
            --green: #2d8a56;
            --green-light: #e6f5ed;
            --blue: #2563eb;
            --blue-light: #e8f0fe;
            --border: #e0d5c7;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.07);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            --font-cn: 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', 'Hiragino Sans GB', sans-serif;
            --font-th: 'Noto Sans Thai', 'Sarabun', 'Kanit', sans-serif;
        }
        [data-theme="dark"] {
            --bg: #1a1815;
            --card-bg: #282420;
            --text: #e8e0d4;
            --text-secondary: #b0a590;
            --accent: #e8455c;
            --accent-light: #3d1a22;
            --gold: #d4a017;
            --gold-light: #332810;
            --green: #3cb072;
            --green-light: #1a3325;
            --blue: #4d8af0;
            --blue-light: #1a2540;
            --border: #3d3528;
            --shadow: 0 2px 12px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 8px 30px rgba(0, 0, 0, 0.4);
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: var(--font-th), var(--font-cn), system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            transition: background var(--transition), color var(--transition);
            line-height: 1.6;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        /* Header */
        .header {
            background: var(--card-bg);
            border-bottom: 1px solid var(--border);
            padding: 12px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
            transition: background var(--transition), border var(--transition);
        }
        .header-inner {
            max-width: 1100px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .logo {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--accent);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.02em;
        }
        .logo span {
            font-size: 1.6rem;
        }
        .header-actions {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }
        .btn {
            padding: 8px 16px;
            border-radius: 20px;
            border: 1.5px solid var(--border);
            background: var(--card-bg);
            color: var(--text);
            cursor: pointer;
            font-size: 0.9rem;
            font-family: inherit;
            transition: all var(--transition);
            white-space: nowrap;
            font-weight: 500;
        }
        .btn:hover {
            border-color: var(--accent);
            background: var(--accent-light);
            transform: translateY(-1px);
        }
        .btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
            font-weight: 600;
        }
        .btn-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border: 1.5px solid var(--border);
            background: var(--card-bg);
            cursor: pointer;
            transition: all var(--transition);
        }
        .btn-icon:hover {
            border-color: var(--accent);
            background: var(--accent-light);
        }
        /* Main */
        .main {
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
        }
        /* Top Stats Bar */
        .stats-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .stat-card {
            flex: 1;
            min-width: 90px;
            background: var(--card-bg);
            border-radius: var(--radius-sm);
            padding: 14px 16px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: all var(--transition);
        }
        .stat-value {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--accent);
        }
        .stat-label {
            font-size: 0.78rem;
            color: var(--text-secondary);
            margin-top: 2px;
        }
        /* Mode Tabs */
        .mode-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 5px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }
        .mode-tab {
            flex: 1;
            min-width: 80px;
            padding: 10px 14px;
            border-radius: 20px;
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            font-family: inherit;
            transition: all var(--transition);
            text-align: center;
            white-space: nowrap;
        }
        .mode-tab:hover {
            color: var(--text);
            background: var(--accent-light);
        }
        .mode-tab.active {
            background: var(--accent);
            color: #fff;
            font-weight: 600;
            box-shadow: 0 2px 8px rgba(196, 30, 58, 0.3);
        }
        /* Game Area */
        .game-area {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 28px 24px;
            min-height: 420px;
            box-shadow: var(--shadow-lg);
            border: 1px solid var(--border);
            transition: all var(--transition);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        /* Flashcard */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            max-width: 500px;
            cursor: pointer;
        }
        .flashcard {
            width: 100%;
            aspect-ratio: 1.6/1;
            min-height: 240px;
            position: relative;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        .flashcard-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: var(--radius);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 24px;
            border: 2px solid var(--border);
            background: var(--card-bg);
            box-shadow: var(--shadow-lg);
        }
        .flashcard-back {
            transform: rotateY(180deg);
            background: linear-gradient(135deg, var(--gold-light), var(--card-bg));
            border-color: var(--gold);
        }
        .flashcard-char {
            font-size: 2.8rem;
            font-weight: 700;
            color: var(--text);
            font-family: var(--font-cn);
            text-align: center;
            letter-spacing: 0.04em;
        }
        .flashcard-pinyin {
            font-size: 1.2rem;
            color: var(--accent);
            margin-top: 8px;
            font-weight: 500;
        }
        .flashcard-meaning {
            font-size: 1.15rem;
            color: var(--text-secondary);
            margin-top: 6px;
            text-align: center;
        }
        .flashcard-hint {
            position: absolute;
            bottom: 12px;
            font-size: 0.75rem;
            color: var(--text-secondary);
            opacity: 0.7;
        }
        .flashcard-nav {
            display: flex;
            gap: 16px;
            margin-top: 20px;
            align-items: center;
        }
        .flashcard-nav .btn {
            min-width: 50px;
            font-size: 1.1rem;
        }
        .flashcard-counter {
            font-size: 0.9rem;
            color: var(--text-secondary);
            font-weight: 500;
        }
        /* Quiz */
        .quiz-question {
            font-size: 2.2rem;
            font-weight: 700;
            font-family: var(--font-cn);
            text-align: center;
            margin-bottom: 8px;
            letter-spacing: 0.04em;
        }
        .quiz-subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 20px;
            text-align: center;
        }
        .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            width: 100%;
            max-width: 550px;
        }
        .quiz-option {
            padding: 14px 18px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            background: var(--card-bg);
            cursor: pointer;
            font-size: 1rem;
            font-family: inherit;
            transition: all 0.2s;
            text-align: left;
            font-weight: 500;
            color: var(--text);
        }
        .quiz-option:hover {
            border-color: var(--blue);
            background: var(--blue-light);
            transform: translateY(-2px);
            box-shadow: var(--shadow);
        }
        .quiz-option.correct {
            border-color: var(--green) !important;
            background: var(--green-light) !important;
            animation: pulse-green 0.5s ease;
        }
        .quiz-option.wrong {
            border-color: var(--accent) !important;
            background: var(--accent-light) !important;
            animation: shake 0.4s ease;
        }
        @keyframes pulse-green {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.03);
            }
        }
        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-6px);
            }
            75% {
                transform: translateX(6px);
            }
        }
        .quiz-feedback {
            text-align: center;
            margin-top: 16px;
            font-weight: 600;
            font-size: 1.1rem;
            min-height: 28px;
        }
        /* Matching Game */
        .matching-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            width: 100%;
            max-width: 650px;
        }
        .match-card {
            aspect-ratio: 1.3/1;
            min-height: 80px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--border);
            background: var(--card-bg);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-weight: 600;
            font-size: 0.9rem;
            transition: all 0.2s;
            padding: 8px;
            font-family: var(--font-cn), var(--font-th);
            color: var(--text);
        }
        .match-card:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow);
            transform: translateY(-2px);
        }
        .match-card.selected {
            border-color: var(--blue);
            background: var(--blue-light);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }
        .match-card.matched {
            border-color: var(--green) !important;
            background: var(--green-light) !important;
            pointer-events: none;
            opacity: 0.75;
        }
        /* Typing */
        .typing-display {
            font-size: 3rem;
            font-weight: 700;
            font-family: var(--font-cn);
            text-align: center;
            margin-bottom: 16px;
            letter-spacing: 0.06em;
        }
        .typing-input {
            width: 100%;
            max-width: 450px;
            padding: 12px 18px;
            border-radius: 24px;
            border: 2px solid var(--border);
            font-size: 1.1rem;
            text-align: center;
            font-family: inherit;
            background: var(--bg);
            color: var(--text);
            transition: all var(--transition);
            outline: none;
        }
        .typing-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(196, 30, 58, 0.1);
        }
        .typing-hint {
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 8px;
        }
        /* Sentence Scramble */
        .scramble-words {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            margin: 16px 0;
            min-height: 50px;
            padding: 12px;
            border-radius: var(--radius-sm);
            border: 2px dashed var(--border);
            background: var(--bg);
        }
        .scramble-word {
            padding: 8px 14px;
            border-radius: 18px;
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            cursor: grab;
            font-weight: 500;
            font-family: var(--font-cn);
            transition: all 0.2s;
            font-size: 0.95rem;
            color: var(--text);
        }
        .scramble-word:hover {
            border-color: var(--accent);
            background: var(--accent-light);
        }
        .scramble-word.placed {
            background: var(--green-light);
            border-color: var(--green);
            cursor: default;
        }
        .scramble-answer {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
            min-height: 48px;
            padding: 10px;
            border-radius: var(--radius-sm);
            border: 2px dashed var(--green);
            background: var(--green-light);
            margin-bottom: 12px;
        }
        /* Feedback Toast */
        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 12px 24px;
            border-radius: 24px;
            font-weight: 600;
            z-index: 999;
            animation: toast-in 0.3s ease, toast-out 0.3s ease 1.5s forwards;
            pointer-events: none;
            font-size: 0.95rem;
            box-shadow: var(--shadow-lg);
        }
        .toast.success {
            background: var(--green);
            color: #fff;
        }
        .toast.error {
            background: var(--accent);
            color: #fff;
        }
        @keyframes toast-in {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }
        @keyframes toast-out {
            from {
                opacity: 1;
            }
            to {
                opacity: 0;
                transform: translateX(-50%) translateY(-30px);
            }
        }
        /* Responsive */
        @media (max-width: 768px) {
            .header-inner {
                flex-direction: column;
                gap: 8px;
            }
            .mode-tabs {
                flex-wrap: nowrap;
                overflow-x: auto;
                -webkit-overflow-scrolling: touch;
                gap: 4px;
                padding: 4px;
            }
            .mode-tab {
                flex: none;
                font-size: 0.78rem;
                padding: 8px 10px;
                min-width: auto;
            }
            .quiz-options {
                grid-template-columns: 1fr;
            }
            .matching-grid {
                grid-template-columns: repeat(3, 1fr);
                gap: 6px;
            }
            .match-card {
                font-size: 0.75rem;
                min-height: 60px;
            }
            .flashcard-char {
                font-size: 2rem;
            }
            .typing-display {
                font-size: 2.2rem;
            }
            .quiz-question {
                font-size: 1.6rem;
            }
            .stats-bar {
                gap: 6px;
            }
            .stat-card {
                padding: 10px 8px;
            }
            .stat-value {
                font-size: 1.2rem;
            }
        }
        @media (max-width: 400px) {
            .matching-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .flashcard-char {
                font-size: 1.6rem;
            }
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            border: 0;
        }
    </style>
</head>

    <script>
        // ============ CSV PARSER ============
        function parseCSVLine(line) {
            const result = [];
            let current = '';
            let inQuotes = false;
            for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                    if (inQuotes && i + 1 < line.length && line[i + 1] === '"') {
                        current += '"';
                        i++;
                    } else {
                        inQuotes = !inQuotes;
                    }
                } else if (ch === ',' && !inQuotes) {
                    result.push(current.trim());
                    current = '';
                } else {
                    current += ch;
                }
            }
            result.push(current.trim());
            return result;
        }

        function parseCSV(text, skipHeader = true) {
            const lines = text.trim().split('\n');
            const start = skipHeader ? 1 : 0;
            return lines.slice(start).map(line => parseCSVLine(line)).filter(r => r.length >= 2 && r[0]);
        }

        // ============ PARSE DATA ============
        function parseWordsCSV(csv) {
            const lines = csv.trim().split('\n');
            const words = [];
            for (const line of lines) {
                const parts = parseCSVLine(line);
                if (parts.length >= 4 && parts[0] && parts[0].length >= 1 && !parts[0].startsWith('简体字')) {
                    words.push({
                        chinese: parts[0].trim(),
                        pinyin: (parts[1] || '').trim(),
                        thai: (parts[2] || '').trim(),
                        english: (parts[3] || '').trim(),
                        type: 'word'
                    });
                }
            }
            return words;
        }

        function parseSentencesCSV(csv) {
            const lines = csv.trim().split('\n');
            const sentences = [];
            for (const line of lines) {
                const parts = parseCSVLine(line);
                if (parts.length >= 4 && parts[0] && parts[0].length > 2) {
                    sentences.push({
                        chinese: parts[0].trim().replace(/^"|"$/g, ''),
                        pinyin: (parts[1] || '').trim(),
                        thai: (parts[2] || '').trim(),
                        english: (parts[3] || '').trim(),
                        type: 'sentence'
                    });
                }
            }
            return sentences;
        }

        let allWords = parseWordsCSV(wordCSV);
        let allSentences = parseSentencesCSV(sentenceCSV);

        // Deduplicate
        allWords = allWords.filter((w, i, arr) => arr.findIndex(x => x.chinese === w.chinese) === i);
        allSentences = allSentences.filter((s, i, arr) => arr.findIndex(x => x.chinese === s.chinese) ===
        i);

        // Combine all items
        let allItems = [...allWords, ...allSentences];

        // ============ STATE ============
        let currentFilter = 'all'; // 'all' | 'vocab' | 'sentence'
        let currentMode = 'flashcard';
        let currentItems = [...allItems];
        let currentIndex = 0;
        let streak = 0;
        let totalCorrect = 0;
        let totalAttempts = 0;
        let quizAnswered = false;
        let matchingPairs = [];
        let matchingSelected = null;
        let matchingMatched = 0;
        let scrambleAnswer = [];
        let scrambleWords = [];
        let typingItem = null;
        let typingAttempts = 0;

        // Load stats
        function loadStats() {
            try {
                const s = JSON.parse(localStorage.getItem('cnlearn_stats') || '{}');
                streak = s.streak || 0;
                totalCorrect = s.totalCorrect || 0;
                totalAttempts = s.totalAttempts || 0;
            } catch (e) {}
        }

        function saveStats() {
            try {
                localStorage.setItem('cnlearn_stats', JSON.stringify({ streak, totalCorrect, totalAttempts }));
            } catch (e) {}
        }
        loadStats();

        // ============ HELPERS ============
        function getFilteredItems() {
            if (currentFilter === 'vocab') return [...allWords];
            if (currentFilter === 'sentence') return [...allSentences];
            return [...allItems];
        }

        function shuffle(arr) {
            const a = [...arr];
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        function showToast(msg, type = 'success') {
            const existing = document.querySelector('.toast');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.textContent = msg;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        function updateStats() {
            document.getElementById('stat-streak').textContent = `🔥 ${streak}`;
            document.getElementById('stat-correct').textContent = `✅ ${totalCorrect}`;
            document.getElementById('stat-total').textContent = `📊 ${totalAttempts}`;
            const acc = totalAttempts > 0 ? Math.round((totalCorrect / totalAttempts) * 100) : 0;
            document.getElementById('stat-accuracy').textContent = `🎯 ${acc}%`;
            saveStats();
        }

        function recordAnswer(correct) {
            totalAttempts++;
            if (correct) {
                totalCorrect++;
                streak++;
                showToast('✅ ถูกต้อง! +1 streak', 'success');
            } else {
                streak = 0;
                showToast('❌ ผิด! ลองอีกครั้ง', 'error');
            }
            updateStats();
        }

        function renderFlashcard() {
            const area = document.getElementById('game-area');
            const navArea = document.getElementById('nav-area');
            currentItems = getFilteredItems();
            if (currentItems.length === 0) {
                area.innerHTML = '<p style="text-align:center;color:var(--text-secondary);">ไม่มีข้อมูลในหมวดนี้</p>';
                navArea.innerHTML = '';
                return;
            }
            if (currentIndex >= currentItems.length) currentIndex = 0;
            const item = currentItems[currentIndex];
            const isSentence = item.type === 'sentence';

            <div class="flashcard-container" onclick="flipCard(this)" id="flashcard-el">
              <div class="flashcard" id="flashcard-inner">
                <div class="flashcard-face">
                  <div class="flashcard-char">${item.chinese}</div>
                  <div class="flashcard-pinyin">${item.pinyin || ''}</div>

                </div>
                <div class="flashcard-face flashcard-back">
                  <div class="flashcard-char" style="font-size:${isSentence?'1.3rem':'2rem'};">${item.thai}</div>
                  <div class="flashcard-meaning">${item.english}</div>
                  <div class="flashcard-pinyin" style="font-size:0.9rem;margin-top:8px;">${item.pinyin || ''}</div>
                  <div class="flashcard-hint">👆 คลิกเพื่อกลับ</div>
                </div>
              </div>
            </div>
          `;
            navArea.innerHTML = `
            <div class="flashcard-nav" style="display:flex;justify-content:center;align-items:center;gap:16px;">
              <button class="btn" onclick="prevCard()" ${currentIndex===0?'disabled':''}>⬅ ก่อนหน้า</button>
              <span class="flashcard-counter">${currentIndex+1} / ${currentItems.length}</span>
              <button class="btn" onclick="nextCard()">ต่อไป ➡</button>
              <button class="btn" style="background:var(--green);color:#fff;border-color:var(--green);" onclick="markKnown()">✅ รู้แล้ว</button>
            </div>
          `;
        }

        function flipCard(el) {
            const inner = el.querySelector('#flashcard-inner') || el;
            inner.classList.toggle('flipped');
        }

        function prevCard() {
            if (currentIndex > 0) { currentIndex--;
                renderFlashcard(); }
        }

        function nextCard() {
            currentItems = getFilteredItems();
            if (currentIndex < currentItems.length - 1) { currentIndex++;
                renderFlashcard(); } else { currentIndex = 0;
                renderFlashcard(); }
        }

        function markKnown() {
            recordAnswer(true);
            nextCard();
        }

        function renderQuiz() {
            currentItems = getFilteredItems();
            if (currentItems.length < 4) {
                document.getElementById('game-area').innerHTML =
                    '<p style="text-align:center;color:var(--text-secondary);">ต้องการอย่างน้อย 4 รายการสำหรับโหมด Quiz</p>';
                document.getElementById('nav-area').innerHTML = '';
                return;
            }
            const pool = shuffle(currentItems);
            const correct = pool[0];
            let options = [correct, pool[1], pool[2], pool[3]];
            // Ensure uniqueness
            const seen = new Set();
            options = options.filter(o => { const k = o.chinese; if (seen.has(k)) return false;
                seen.add(k); return true; });
            while (options.length < 4 && pool.length > options.length) {
                const extra = pool[options.length + 3];
                if (extra && !seen.has(extra.chinese)) { options.push(extra);
                    seen.add(extra.chinese); }
            }
            options = shuffle(options.slice(0, 4));
            quizAnswered = false;
            const area = document.getElementById('game-area');
            area.innerHTML = `
            <div class="quiz-question">${correct.chinese}</div>
            <div class="quiz-subtitle">${correct.pinyin || ''}</div>
            <div class="quiz-options" id="quiz-options">
              ${options.map((o,i)=>`<button class="quiz-option" data-index="${i}" data-correct="${o.chinese===correct.chinese}" onclick="answerQuiz(this,'${correct.chinese.replace(/'/g,"\\'")}')">${o.thai} <small style="color:var(--text-secondary);display:block;">${o.english}</small></button>`).join('')}
            </div>
            <div class="quiz-feedback" id="quiz-feedback"></div>
          `;
            document.getElementById('nav-area').innerHTML = `
            <div style="display:flex;justify-content:center;gap:12px;margin-top:8px;">
              <button class="btn" onclick="renderQuiz()">🔄 ข้อต่อไป</button>
            </div>
          `;
        }

        function answerQuiz(btn, correctChinese) {
            if (quizAnswered) return;
            quizAnswered = true;
            const isCorrect = btn.dataset.correct === 'true';
            const allBtns = document.querySelectorAll('#quiz-options .quiz-option');
            allBtns.forEach(b => {
                b.style.pointerEvents = 'none';
                if (b.dataset.correct === 'true') b.classList.add('correct');
                if (b === btn && !isCorrect) b.classList.add('wrong');
            });
            document.getElementById('quiz-feedback').textContent = isCorrect ? '✅ ถูกต้อง!' :
                `❌ คำตอบที่ถูกต้องคือ: ${correctChinese}`;
            document.getElementById('quiz-feedback').style.color = isCorrect ? 'var(--green)' : 'var(--accent)';
            recordAnswer(isCorrect);
        }

        function renderMatching() {
            currentItems = getFilteredItems().filter(i => i.type === 'word');
            if (currentItems.length < 6) {
                document.getElementById('game-area').innerHTML =
                    '<p style="text-align:center;color:var(--text-secondary);">ต้องการคำศัพท์อย่างน้อย 6 คำสำหรับโหมดจับคู่</p>';
                document.getElementById('nav-area').innerHTML = '';
                return;
            }
            const pool = shuffle(currentItems).slice(0, 8);
            matchingPairs = pool;
            matchingSelected = null;
            matchingMatched = 0;
            const cards = [];
            pool.forEach((item, i) => {
                cards.push({ id: i, text: item.chinese, pairId: i, side: 'chinese', item });
                cards.push({ id: i + 100, text: item.thai + ' / ' + item.english, pairId: i, side: 'meaning',
                    item });
            });
            const shuffledCards = shuffle(cards);
            const area = document.getElementById('game-area');
            area.innerHTML = `
            <div class="matching-grid" id="matching-grid">
              ${shuffledCards.map(c=>`<div class="match-card" data-pair="${c.pairId}" data-side="${c.side}" data-id="${c.id}" onclick="selectMatch(this)">${c.text}</div>`).join('')}
            </div>
            <p style="text-align:center;margin-top:12px;color:var(--text-secondary);">จับคู่คำศัพท์ภาษาจีนกับคำแปล</p>
          `;
            document.getElementById('nav-area').innerHTML = `
            <div style="display:flex;justify-content:center;gap:12px;margin-top:8px;">
              <button class="btn" onclick="renderMatching()">🔄 เริ่มใหม่</button>
              <span style="display:flex;align-items:center;font-weight:600;color:var(--green);">คู่ที่จับได้: ${matchingMatched}/${pool.length}</span>
            </div>
          `;
        }

        function selectMatch(card) {
            if (card.classList.contains('matched')) return;
            // พูดออกเสียงภาษาจีนเมื่อคลิกการ์ดฝั่งจีน
            if (card.dataset.side === 'chinese') {
                speakChinese(card.textContent.trim());
            }
            if (!matchingSelected) {
                card.classList.add('selected');
                matchingSelected = card;
            } else if (matchingSelected === card) {
                card.classList.remove('selected');
                matchingSelected = null;
            } else {
                const pair1 = matchingSelected.dataset.pair;
                const pair2 = card.dataset.pair;
                const side1 = matchingSelected.dataset.side;
                const side2 = card.dataset.side;
                if (pair1 === pair2 && side1 !== side2) {
                    matchingSelected.classList.add('matched');
                    card.classList.add('matched');
                    matchingSelected.classList.remove('selected');
                    matchingMatched++;
                    recordAnswer(true);
                    document.querySelector('#nav-area span').textContent =
                        `คู่ที่จับได้: ${matchingMatched}/${matchingPairs.length}`;
                    if (matchingMatched === matchingPairs.length) {
                        setTimeout(() => {
                            showToast('🎉 ยินดีด้วย! จับคู่ครบทุกคู่แล้ว!', 'success');
                            renderMatching();
                        }, 600);
                    }
                } else {
                    matchingSelected.classList.add('wrong');
                    card.classList.add('wrong');
                    setTimeout(() => {
                        matchingSelected.classList.remove('wrong', 'selected');
                        card.classList.remove('wrong');
                    }, 500);
                    recordAnswer(false);
                }
                matchingSelected = null;
            }
        }

        function checkTyping(event) {
            if (event.key !== 'Enter') return;
            const input = document.getElementById('typing-input');
            const feedback = document.getElementById('typing-feedback');
            const userAnswer = input.value.trim().toLowerCase();
            const correctPinyin = (typingItem.pinyin || '').toLowerCase().replace(/[，。！？、,\.!\?]/g, '').trim();
            const userClean = userAnswer.replace(/[，。！？、,\.!\?]/g, '').trim();
            const similarity = userClean === correctPinyin;
            if (similarity || userClean.length > 0 && correctPinyin.includes(userClean) && userClean.length > 3) {
                feedback.textContent = '✅ ถูกต้อง! เก่งมาก!';
                feedback.style.color = 'var(--green)';
                recordAnswer(true);
                input.disabled = true;
                setTimeout(renderTyping, 1500);
            } else {
                typingAttempts++;
                feedback.textContent = `❌ ยังไม่ถูกต้อง ลองอีกครั้ง (ครั้งที่ ${typingAttempts})`;
                feedback.style.color = 'var(--accent)';
                recordAnswer(false);
                if (typingAttempts >= 3) {
                    feedback.textContent = `เฉลย: ${typingItem.pinyin}`;
                    feedback.style.color = 'var(--gold)';
                    input.disabled = true;
                    setTimeout(renderTyping, 2000);
                }
            }
        }

        function renderScramble() {
            currentItems = getFilteredItems().filter(i => i.type === 'sentence');
            if (currentItems.length < 3) {
                document.getElementById('game-area').innerHTML =
                    '<p style="text-align:center;color:var(--text-secondary);">ต้องการประโยคอย่างน้อย 3 ประโยคสำหรับโหมดเรียงประโยค</p>';
                document.getElementById('nav-area').innerHTML = '';
                return;
            }
            const item = currentItems[Math.floor(Math.random() * currentItems.length)];
            const chars = item.chinese.split('');
            // For sentences, split by common delimiters or keep as chunks
            let words;
            if (item.chinese.length <= 15) {
                words = item.chinese.split('');
            } else {
                // Split into meaningful chunks
                words = item.chinese.split(/([，。！？、,\.!\?])/).filter(Boolean).flatMap(chunk => {
                    if (/^[，。！？、,\.!\?]$/.test(chunk)) return [chunk];
                    return chunk.split('').reduce((acc, ch, i, arr) => {
                        if (i % 3 === 0) acc.push(ch);
                        else acc[acc.length - 1] += ch;
                        return acc;
                    }, []);
                });
            }
            scrambleWords = shuffle(words.filter(w => w.trim()));
            scrambleAnswer = [];
            const area = document.getElementById('game-area');
            area.innerHTML = `
            <p style="text-align:center;color:var(--text-secondary);margin-bottom:8px;">เรียงคำให้เป็นประโยคที่ถูกต้อง</p>

            <div class="scramble-words" id="scramble-words">
              ${scrambleWords.map((w,i)=>`<span class="scramble-word" data-index="${i}" onclick="placeScrambleWord(${i})">${w}</span>`).join('')}
            </div>
            <div style="display:flex;gap:10px;justify-content:center;margin-top:8px;">
              <button class="btn" onclick="undoScramble()">↩ ถอยหลัง</button>
              <button class="btn" style="background:var(--green);color:#fff;border-color:var(--green);" onclick="checkScramble('${item.chinese.replace(/'/g,"\\'")}')">✅ ตรวจสอบ</button>
              <button class="btn" onclick="renderScramble()">🔄 ใหม่</button>

            <div id="scramble-feedback" style="text-align:center;margin-top:10px;min-height:24px;font-weight:600;"></div>
          `;
            document.getElementById('nav-area').innerHTML = '';
        }

        function placeScrambleWord(index) {
            const wordEl = document.querySelectorAll('#scramble-words .scramble-word')[index];
            if (!wordEl || wordEl.classList.contains('placed')) return;
            wordEl.classList.add('placed');
            scrambleAnswer.push({ text: wordEl.textContent, index });
            updateScrambleDisplay();
        }

        function undoScramble() {
            if (scrambleAnswer.length === 0) return;
            const last = scrambleAnswer.pop();
            const wordEl = document.querySelectorAll('#scramble-words .scramble-word')[last.index];
            if (wordEl) wordEl.classList.remove('placed');
            updateScrambleDisplay();
        }

        function updateScrambleDisplay() {
            const answerDiv = document.getElementById('scramble-answer');
            if (answerDiv) {
                answerDiv.innerHTML = scrambleAnswer.map(w =>
                    `<span class="scramble-word" style="background:var(--green-light);border-color:var(--green);cursor:pointer;" onclick="removeFromAnswer(${w.index})">${w.text}</span>`
                    ).join('') || '<span style="color:var(--text-secondary);opacity:0.6;">วางคำที่นี่...</span>';
            }
        }

        function removeFromAnswer(index) {
            scrambleAnswer = scrambleAnswer.filter(w => w.index !== index);
            const wordEl = document.querySelectorAll('#scramble-words .scramble-word')[index];
            if (wordEl) wordEl.classList.remove('placed');
            updateScrambleDisplay();
        }

        function checkScramble(correctChinese) {
            const userAnswer = scrambleAnswer.map(w => w.text).join('');
            const correct = userAnswer === correctChinese;
            const feedback = document.getElementById('scramble-feedback');
            if (correct) {
                feedback.textContent = '✅ ถูกต้อง! ยอดเยี่ยม!';
                feedback.style.color = 'var(--green)';
                recordAnswer(true);
                setTimeout(renderScramble, 1800);
            } else {
                feedback.textContent = `❌ ยังไม่ถูกต้อง ลองใหม่!`;
                feedback.style.color = 'var(--accent)';
                recordAnswer(false);
            }
        }

    function renderListen() {
        currentItems = getFilteredItems();
        if (currentItems.length === 0) { /* ... */ return; }
        const item = currentItems[Math.floor(Math.random() * currentItems.length)];
        const area = document.getElementById('game-area');
        area.innerHTML = `
      <p style="text-align:center;font-size:1.1rem;color:var(--text-secondary);margin-bottom:12px;">
        👂 ฟังเสียงและเลือกคำแปลที่ถูกต้อง
      </p>
      <!-- แสดงตัวอักษรจีน พร้อมปุ่มฟัง -->
      <div style="font-size:2.5rem;text-align:center;font-weight:700;color:var(--accent);margin:16px 0;padding:20px;border-radius:var(--radius-sm);background:var(--accent-light);border:2px dashed var(--accent);cursor:pointer;" 
           onclick="speakChinese('${item.chinese.replace(/'/g, "\\'")}')" 
           title="คลิกเพื่อฟังอีกครั้ง">
        🔊 ${item.chinese}
      </div>
      <p style="text-align:center;color:var(--text-secondary);font-size:0.85rem;">คลิกที่ตัวอักษรเพื่อฟัง</p>
      <div class="quiz-options" id="listen-options" style="margin-top:16px;"></div>
      <div id="listen-feedback" style="text-align:center;margin-top:12px;min-height:24px;font-weight:600;"></div>
    `;
        // สร้างตัวเลือก 4 ตัว (ไม่ซ้ำกับ item)
        const distractors = shuffle(currentItems.filter(i => i.chinese !== item.chinese)).slice(0, 3);
        let options = shuffle([item, ...distractors]);

        // กันตัวเลือกซ้ำ
        const seen = new Set();
        options = options.filter(o => {
            if (seen.has(o.chinese)) return false;
            seen.add(o.chinese);
            return true;
        });

        // ถ้าไม่ครบ 4 เติมจาก pool
        while (options.length < 4 && currentItems.length > options.length) {
            const extra = currentItems.find(i => !seen.has(i.chinese));
            if (extra) {
                options.push(extra);
                seen.add(extra.chinese);
            } else break;
        }
        options = shuffle(options.slice(0, 4));

        const optDiv = document.getElementById('listen-options');
        optDiv.innerHTML = options.map((o, i) => `
            <button class="quiz-option"
                    data-correct="${o.chinese === item.chinese}"
                    onclick="answerListen(this, '${item.chinese.replace(/'/g, "\\'")}', '${item.thai.replace(/'/g, "\\'")}')">
                ${o.thai}
                <small style="color:var(--text-secondary);display:block;">${o.english}</small>
            </button>
        `).join('');

        document.getElementById('nav-area').innerHTML = `
            <div style="display:flex;justify-content:center;gap:12px;margin-top:8px;">
                <button class="btn" onclick="renderListen()">🔄 ข้อต่อไป</button>
            </div>
        `;

        // พูดอัตโนมัติเมื่อโหลดข้อใหม่
        setTimeout(() => speakChinese(item.chinese), 400);
    }

    // เปลี่ยนชื่อฟังก์ชันและให้พูดตัวจีน
    function speakChinese(text) {
        if (!text || typeof window.speechSynthesis === 'undefined') return;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'zh-CN';  // เสียงจีนกลาง
        utterance.rate = 0.8;
        utterance.pitch = 1;
        window.speechSynthesis.cancel(); // ยกเลิกเสียงค้างก่อนพูดใหม่
        try { window.speechSynthesis.speak(utterance); } catch (e) {}
    }

        function answerListen(btn, correctChinese, correctThai) {
            const allBtns = document.querySelectorAll('#listen-options .quiz-option');
            if (btn.dataset.answered === 'true') return;
            allBtns.forEach(b => b.dataset.answered = 'true');
            const isCorrect = btn.dataset.correct === 'true';
            allBtns.forEach(b => {
                b.style.pointerEvents = 'none';
                if (b.dataset.correct === 'true') b.classList.add('correct');
                if (b === btn && !isCorrect) b.classList.add('wrong');
            });
            document.getElementById('listen-feedback').textContent = isCorrect ? '✅ ถูกต้อง!' :
                `❌ คำตอบ: ${correctThai}`;
            document.getElementById('listen-feedback').style.color = isCorrect ? 'var(--green)' : 'var(--accent)';
            recordAnswer(isCorrect);
        }

        // ============ MODE SWITCHING ============
        function switchMode(mode, btnEl) {
            currentMode = mode;
            document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');
            currentIndex = 0;
            switch (mode) {
                case 'flashcard':
                    renderFlashcard();
                    break;
                case 'quiz':
                    renderQuiz();
                    break;
                case 'matching':
                    renderMatching();
                    break;
                case 'typing':
                    renderTyping();
                    break;
                case 'scramble':
                    renderScramble();
                    break;
                case 'listen':
                    renderListen();
                    break;
                default:
                    renderFlashcard();
            }
        }

        function setFilter(filter, btnEl) {
            currentFilter = filter;
            document.querySelectorAll('.header-actions .btn[data-filter]').forEach(b => b.classList.remove(
            'active'));
            if (btnEl) btnEl.classList.add('active');
            currentIndex = 0;
            switch (currentMode) {
                case 'flashcard':
                    renderFlashcard();
                    break;
                case 'quiz':
                    renderQuiz();
                    break;
                case 'matching':
                    renderMatching();
                    break;
                case 'typing':
                    renderTyping();
                    break;
                case 'scramble':
                    renderScramble();
                    break;
                case 'listen':
                    renderListen();
                    break;
                default:
                    renderFlashcard();
            }
        }

        function toggleTheme() {
            const body = document.body;
            const current = body.getAttribute('data-theme');
            const next = current === 'dark' ? 'light' : 'dark';
            body.setAttribute('data-theme', next);
            try { localStorage.setItem('cnlearn_theme', next); } catch (e) {}
        }

        // ============ KEYBOARD SHORTCUTS ============
        document.addEventListener('keydown', (e) => {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            switch (e.key) {
                case 'ArrowLeft':
                    if (currentMode === 'flashcard') prevCard();
                    break;
                case 'ArrowRight':
                    if (currentMode === 'flashcard') nextCard();
                    break;
                case ' ':
                    if (currentMode === 'flashcard') {
                        e.preventDefault();
                        const card = document.getElementById('flashcard-inner');
                        if (card) card.classList.toggle('flipped');
                    }
                    break;
                case '1':
                    document.querySelectorAll('.mode-tab')[0]?.click();
                    break;
                case '2':
                    document.querySelectorAll('.mode-tab')[1]?.click();
                    break;
                case '3':
                    document.querySelectorAll('.mode-tab')[2]?.click();
                    break;
                case '4':
                    document.querySelectorAll('.mode-tab')[3]?.click();
                    break;
                case '5':
                    document.querySelectorAll('.mode-tab')[4]?.click();
                    break;
                case '6':
                    document.querySelectorAll('.mode-tab')[5]?.click();
                    break;
            }
        });

        // ============ INIT ============
        function init() {
            // Load theme
            try {
                const savedTheme = localStorage.getItem('cnlearn_theme');
                if (savedTheme) document.body.setAttribute('data-theme', savedTheme);
            } catch (e) {}
            updateStats();
            renderFlashcard();
        }

        init();
        console.log('🐼 เรียนภาษาจีน App พร้อมแล้ว!');
        console.log('📚 ' + allWords.length + ' คำศัพท์ | 💬 ' + allSentences.length + ' ประโยค');
        console.log('⌨️ กด 1-6 เพื่อเปลี่ยนโหมด | ← → เพื่อเลื่อน flashcard | Space เพื่อพลิกการ์ด');
    </script>
</body>
</html>
