<!DOCTYPE html>
<html lang="zh-TH">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>เรียนภาษาจีน | Chinese Learning</title>
    <link rel="stylesheet" href="styles.css">
    <!-- Optional: Import Chinese fonts for better display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700&family=Noto+Sans+Thai:wght@400;600&display=swap" rel="stylesheet">
</head>
<body data-theme="light">
    <header class="app-header">
        <div class="logo">
            <span class="logo-icon">🐼</span>
            <span class="logo-text">เรียนจีน</span>
        </div>
        <div class="header-actions">
            <button class="btn-filter active" data-filter="all" onclick="setFilter('all',this)">ทั้งหมด</button>
            <button class="btn-filter" data-filter="vocab" onclick="setFilter('vocab',this)">คำศัพท์</button>
            <button class="btn-filter" data-filter="sentence" onclick="setFilter('sentence',this)">ประโยค</button>
            <button class="btn-theme" onclick="toggleTheme()" aria-label="เปลี่ยนธีม">🌓</button>
        </div>
    </header>

    <main class="app-main">
        <!-- Stats Bar -->
        <div class="stats-bar">
            <div class="stat-card"><div class="stat-value" id="stat-streak">🔥 0</div><div class="stat-label">Streak</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-correct">✅ 0</div><div class="stat-label">ถูก</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-total">📊 0</div><div class="stat-label">ทั้งหมด</div></div>
            <div class="stat-card"><div class="stat-value" id="stat-accuracy">🎯 0%</div><div class="stat-label">แม่นยำ</div></div>
            <div class="stat-card reset-card" onclick="resetAllStats()"><span class="stat-value">🗑️</span><span class="stat-label">รีเซ็ต</span></div>
        </div>

        <!-- Mode Tabs -->
        <nav class="mode-tabs" id="mode-tabs">
            <button class="mode-tab active" data-mode="quiz" onclick="switchMode('quiz',this)">❓ Quiz</button>
            <button class="mode-tab" data-mode="matching" onclick="switchMode('matching',this)">🀄 จับคู่</button>
            <button class="mode-tab" data-mode="scramble" onclick="switchMode('scramble',this)">🧩 เรียงประโยค</button>
            <button class="mode-tab" data-mode="listen" onclick="switchMode('listen',this)">👂 ฟังแล้วตอบ</button>
        </nav>

        <!-- Game Area -->
        <div class="game-area" id="game-area"></div>
        <div class="nav-area" id="nav-area"></div>
    </main>

    <script src="script.js"></script>
</body>
</html>
